<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Theft Electricity Monitoring System — Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- LOGIN CARD -->
        <div class="login-card" id="login-card">
            <div class="login-logo">
                <div class="logo-icon">⚡</div>
                <h1>Anti-Theft EMS</h1>
                <p>Electricity Theft Detection & Monitoring System</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username or Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-username" placeholder="Enter your username or email" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    Sign In ⚡
                </button>

                <div class="text-center mt-3" style="font-size: 13px; color: var(--text-secondary);">
                    Don't have an account? <a href="#" id="show-register" style="font-weight: 600;">Register Now</a>
                </div>
            </form>
        </div>

        <!-- REGISTER CARD -->
        <div class="login-card hidden" id="register-card">
            <div class="login-logo">
                <div class="logo-icon">⚡</div>
                <h1>Create Account</h1>
                <p>Register as a new Administrator / Operator</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-fullname">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-fullname" placeholder="John Doe" required>
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-username" placeholder="admin" required>
                        <span class="input-icon">🆔</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="reg-email" placeholder="admin@example.com" required>
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    Register Account 🚀
                </button>

                <div class="text-center mt-3" style="font-size: 13px; color: var(--text-secondary);">
                    Already registered? <a href="#" id="show-login" style="font-weight: 600;">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
